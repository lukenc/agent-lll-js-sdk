<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lll-web-agent 浏览器端 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.setup{background:#fff;padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.setup label{font-size:13px;color:#666;display:flex;flex-direction:column;gap:4px}
.setup select,.setup input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.setup input[type=text]{width:280px}
.setup button{padding:8px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;height:36px}
.setup button:hover{background:#16213e}
.setup .status{font-size:12px;color:#999;align-self:center}
.setup .status.ok{color:#2e7d32}
.header{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:600}
.header .tag{background:#16213e;padding:2px 8px;border-radius:4px;font-size:11px;color:#a0a0c0}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.user{align-self:flex-end;background:#1a1a2e;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.msg.tool{align-self:flex-start;background:#e8f5e9;color:#2e7d32;font-size:12px;font-family:monospace;border-radius:8px}
.msg.error{align-self:center;background:#ffebee;color:#c62828;font-size:13px}
.msg.plan{align-self:flex-start;background:#e3f2fd;color:#1565c0;font-size:13px;border-radius:8px;border-left:3px solid #1565c0}
.msg.phase{align-self:center;background:#f3e5f5;color:#7b1fa2;font-size:12px;border-radius:16px;padding:6px 16px}
.msg.step{align-self:flex-start;background:#fff8e1;color:#f57f17;font-size:12px;font-family:monospace;border-radius:8px;border-left:3px solid #f57f17}
.typing::after{content:'▊';animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.input-area{background:#fff;border-top:1px solid #e0e0e0;padding:12px 24px;display:flex;gap:12px}
.input-area input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.input-area input:focus{border-color:#1a1a2e}
.input-area button{padding:10px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.input-area button:disabled{background:#999;cursor:not-allowed}
.warn{background:#fff3e0;color:#e65100;padding:8px 24px;font-size:12px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>lll-web-agent</h1>
  <span class="tag">浏览器端 Demo</span>
</div>

<div class="setup" id="setup">
  <label>供应商
    <select id="provider">
      <option value="qwen">通义千问 (qwen)</option>
      <option value="deepseek">DeepSeek</option>
      <option value="openai">OpenAI</option>
      <option value="moonshot">Moonshot</option>
      <option value="zhipu">智谱 AI</option>
    </select>
  </label>
  <label>模型
    <input type="text" id="model" value="qwen-turbo" placeholder="模型名称">
  </label>
  <label>API Key
    <input type="text" id="apikey" placeholder="sk-xxx" autocomplete="off">
  </label>
  <label>执行策略
    <select id="strategy">
      <option value="react">ReAct（默认）</option>
      <option value="plan_and_execute">Plan & Execute</option>
    </select>
  </label>
  <button onclick="initAgent()">连接</button>
  <span class="status" id="status">未连接</span>
</div>

<div class="warn">注意：浏览器端直连 LLM API，API Key 暴露在前端。仅用于开发测试，生产环境请使用服务端代理。</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="输入消息..." autocomplete="off" disabled>
  <button id="send" onclick="send()" disabled>发送</button>
</div>

<script src="../dist/lll-web-agent.js"></script>
<script>
var Agent = LllWebAgent.Agent
var defineTool = LllWebAgent.defineTool
var agent = null
var sending = false
var chat = document.getElementById('chat')
var input = document.getElementById('input')
var sendBtn = document.getElementById('send')

// 浏览器端可用的工具
var getCurrentTime = defineTool({
  name: 'get_current_time',
  description: '获取当前时间',
  parameters: { type: 'object', properties: {} },
  execute: async function() { return new Date().toLocaleString('zh-CN') }
})

var calculate = defineTool({
  name: 'calculate',
  description: '计算数学表达式',
  parameters: { type: 'object', properties: { expression: { type: 'string', description: '数学表达式' } }, required: ['expression'] },
  execute: async function(p) { return String(Function('"use strict"; return (' + p.expression + ')')()) }
})

var showPopup = defineTool({
  name: 'show_popup',
  description: '在页面上弹出一个弹窗，向用户展示重要信息。当需要醒目地提示用户某些内容时使用此工具。',
  parameters: { type: 'object', properties: { content: { type: 'string', description: '弹窗中展示的文字内容' } }, required: ['content'] },
  execute: async function(p) {
    return new Promise(function(resolve) {
      // 遮罩
      var overlay = document.createElement('div')
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s'
      // 弹窗
      var box = document.createElement('div')
      box.style.cssText = 'background:#fff;border-radius:12px;padding:28px 32px 20px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:popIn .25s'
      // 图标
      var icon = document.createElement('div')
      icon.style.cssText = 'font-size:32px;text-align:center;margin-bottom:12px'
      icon.textContent = '💡'
      // 内容
      var text = document.createElement('div')
      text.style.cssText = 'font-size:15px;line-height:1.7;color:#333;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto'
      text.textContent = p.content
      // 按钮
      var btn = document.createElement('button')
      btn.style.cssText = 'display:block;margin:20px auto 0;padding:8px 32px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer'
      btn.textContent = '知道了'
      btn.onclick = function() { document.body.removeChild(overlay); resolve('用户已查看弹窗内容') }
      box.appendChild(icon)
      box.appendChild(text)
      box.appendChild(btn)
      overlay.appendChild(box)
      document.body.appendChild(overlay)
    })
  }
})

// 模型联动
document.getElementById('provider').addEventListener('change', function() {
  var models = { qwen: 'qwen-turbo', deepseek: 'deepseek-chat', openai: 'gpt-4', moonshot: 'moonshot-v1-8k', zhipu: 'glm-4' }
  document.getElementById('model').value = models[this.value] || ''
})

input.addEventListener('keydown', function(e) { if (e.key === 'Enter') send() })

function initAgent() {
  var provider = document.getElementById('provider').value
  var model = document.getElementById('model').value
  var apiKey = document.getElementById('apikey').value.trim()
  var strategy = document.getElementById('strategy').value
  if (!apiKey) { alert('请输入 API Key'); return }

  agent = new Agent({
    provider: provider,
    apiKey: apiKey,
    model: model,
    systemPrompt: '你是一个有用的助手，可以查询时间和做数学计算。请用中文回答。',
    tools: [getCurrentTime, calculate, showPopup],
    strategy: strategy,
  })

  var strategyLabel = strategy === 'plan_and_execute' ? 'Plan & Execute' : 'ReAct'
  document.getElementById('status').textContent = '已连接: ' + provider + ' / ' + model + ' (' + strategyLabel + ')'
  document.getElementById('status').className = 'status ok'
  input.disabled = false
  sendBtn.disabled = false
  chat.innerHTML = ''
  var tip = strategy === 'plan_and_execute'
    ? '当前使用 Plan & Execute 策略，会先制定计划再逐步执行。适合复杂多步骤任务。'
    : '当前使用 ReAct 策略，边思考边行动。'
  addMsg('assistant', '已连接 ' + provider + ' (' + model + ')。' + tip + '\n\n试试问我"现在几点了"、"算一下 2^10"，或者"用弹窗告诉我一个笑话"。\n\n💡 切换策略后点击"连接"即可生效。')
  input.focus()
}

async function send() {
  if (!agent || sending) return
  var msg = input.value.trim()
  if (!msg) return
  input.value = ''
  sending = true
  sendBtn.disabled = true

  addMsg('user', msg)
  var el = null

  try {
    var iter = agent.stream(msg)
    while (true) {
      var r = await iter.next()
      if (r.done) break
      var ev = r.value
      switch (ev.type) {
        case 'delta':
          if (!el) { el = addMsg('assistant', ''); el.classList.add('typing') }
          el.textContent += ev.content
          break
        case 'tool_start':
          addMsg('tool', '🔧 ' + ev.name)
          el = null
          break
        case 'tool_end':
          addMsg('tool', '✅ ' + ev.name + ' → ' + (ev.result || '').slice(0, 100))
          el = null
          break
        case 'phase':
          addMsg('phase', '📋 ' + ev.message)
          break
        case 'plan_generated':
          addMsg('plan', '📝 执行计划:\n' + ev.plan.map(function(s) { return '  ' + (s.index + 1) + '. ' + s.description }).join('\n'))
          break
        case 'step_start':
          addMsg('step', '▶ Step ' + (ev.index + 1) + ': ' + ev.description)
          break
        case 'step_complete':
          addMsg('step', (ev.success ? '✅' : '❌') + ' Step ' + (ev.index + 1) + ' (' + ev.duration + 'ms)')
          break
        case 'plan_revised':
          addMsg('plan', '🔄 计划已修订:\n' + ev.plan.map(function(s) { return '  ' + (s.index + 1) + '. ' + s.description + ' [' + s.status + ']' }).join('\n'))
          break
        case 'done':
          if (ev.content && !el) {
            el = addMsg('assistant', ev.content)
          }
          if (el && !el.textContent) el.remove()
          break
        case 'error':
          addMsg('error', '❌ ' + ev.message)
          break
      }
    }
  } catch(err) {
    addMsg('error', '请求失败: ' + err.message)
  }

  if (el) el.classList.remove('typing')
  sending = false
  sendBtn.disabled = false
  input.focus()
}

function addMsg(role, text) {
  var el = document.createElement('div')
  el.className = 'msg ' + role
  el.textContent = text
  chat.appendChild(el)
  chat.scrollTop = chat.scrollHeight
  return el
}
</script>
</body>
</html>
